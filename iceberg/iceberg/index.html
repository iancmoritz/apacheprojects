<html lang="en" data-project="iceberg">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Iceberg in the browser</title>
    <link rel="stylesheet" href="../src/iceberg.css" />
  </head>
  <body class="app">
    <header class="topbar">
      <a class="topbar__back" href="/">&larr; Projects</a>
      <h1>Iceberg</h1>
      <span class="topbar__status" id="status">starting&hellip;</span>
      <span class="topbar__grow"></span>
      <span id="boot-time" class="badge"></span>
      <button class="button" id="reset" type="button" disabled>Reset warehouse</button>
    </header>

    <main class="app__main">
      <div>
        <div class="app__boot" id="boot"></div>

        <section class="panel">
          <h2>Table steps</h2>
          <div class="steps">
            <button id="create" class="button" type="button" disabled>Create table <code>nyc.trips</code></button>
            <button id="append" class="button" type="button" disabled>Append a batch (240 rows)</button>
            <button id="upsert" class="button" type="button" disabled>Upsert: +$25 on 5 trips (MERGE)</button>
            <button id="delete" class="button" type="button" disabled>Delete where <code>fare &lt; 12</code></button>
            <button id="evolve-schema" class="button" type="button" disabled>
              Evolve schema: add <code>tip</code>, rename <code>city</code>
            </button>
            <button id="evolve-spec" class="button" type="button" disabled>
              Evolve partitioning: identity(<code>pickup_city</code>)
            </button>
            <button id="expire" class="button" type="button" disabled>Expire the oldest snapshot</button>
          </div>
          <div id="step-result" class="hint"></div>
        </section>

        <section class="panel">
          <h2>Table</h2>
          <div id="summary" class="hint">no table yet</div>
          <div id="schema"></div>
          <div id="specs"></div>
        </section>
      </div>

      <div>
        <section class="panel">
          <h2>SQL (DuckDB over a PyIceberg scan)</h2>
          <textarea id="sql">
select city, count(*) as trips, round(avg(fare), 2) as avg_fare
from trips
group by 1
order by 1</textarea>
          <div id="schema-hint" class="hint"></div>
          <div class="row">
            <label class="hint" for="as-of">as of</label>
            <select id="as-of">
              <option value="">current snapshot</option>
            </select>
            <button id="run" class="button" type="button" disabled>Run</button>
            <span id="query-meta" class="hint"></span>
          </div>
          <div id="query-error" class="error"></div>
          <div id="query-result" class="scroll"></div>
        </section>

        <section class="panel">
          <h2>Scan planning &amp; file pruning</h2>
          <div class="row">
            <label class="hint" for="filter">row filter</label>
            <input id="filter" type="text" value="pickup_ts &gt;= '2024-01-07T00:00:00'" />
            <button id="plan" class="button" type="button" disabled>Plan</button>
            <span id="plan-meta" class="hint"></span>
          </div>
          <div id="plan-error" class="error"></div>
          <div id="plan-result" class="scroll"></div>
        </section>

        <section class="panel">
          <h2>Snapshot log</h2>
          <ul id="snapshots" class="snapshots"></ul>
        </section>
      </div>

      <div>
        <section class="panel">
          <h2>Warehouse on disk</h2>
          <div id="tree-meta" class="hint"></div>
          <div class="scroll">
            <ul id="tree" class="tree"></ul>
          </div>
        </section>

        <section class="panel">
          <h2>File inspector</h2>
          <div id="preview-meta" class="hint">pick a file on the left</div>
          <div id="preview"></div>
        </section>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
