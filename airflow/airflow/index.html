<html lang="en" data-project="airflow">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Airflow in the browser</title>
    <link rel="stylesheet" href="../src/airflow.css" />
  </head>
  <body class="app">
    <header class="topbar">
      <a class="topbar__back" href="/">&larr; Projects</a>
      <h1>Airflow</h1>
      <span class="topbar__status" id="status">starting&hellip;</span>
      <span class="topbar__grow"></span>
      <span class="topbar__facts">scheduler: <span id="heartbeat">waiting</span></span>
      <button class="button" id="reset" type="button">Reset database</button>
    </header>
    <main class="app__main">
      <div class="app__boot" id="boot"></div>
      <iframe id="ui" title="Airflow UI"></iframe>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
