<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Apache projects, in your browser</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: ui-sans-serif, system-ui, sans-serif;
        --page: #f6f8fb;
        --ink: #10202e;
        --muted: #5b6b7a;
        --card: #fff;
        --edge: #dde5ee;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #0e1620;
          --ink: #eef4fa;
          --muted: #9fb0c0;
          --card: #16202c;
          --edge: #263442;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--page);
        color: var(--ink);
      }
      main {
        max-width: 60rem;
        margin: 0 auto;
        padding: 4rem 1.5rem 5rem;
      }
      h1 {
        margin: 0;
        font-size: 2.25rem;
        letter-spacing: -0.02em;
      }
      .lede {
        margin: 0.75rem 0 0;
        max-width: 42rem;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.55;
      }
      #projects {
        list-style: none;
        margin: 2.5rem 0 0;
        padding: 0;
        display: grid;
        gap: 1.25rem;
        grid-template-columns: repeat(auto-fill, minmax(18rem, 1fr));
      }
      .card {
        background: var(--card);
        border: 1px solid var(--edge);
        border-top: 4px solid var(--accent, #017cee);
        border-radius: 0.9rem;
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }
      .card:hover {
        transform: translateY(-2px);
        box-shadow: 0 0.6rem 1.5rem rgb(16 32 46 / 12%);
      }
      .card a {
        display: block;
        padding: 1.25rem 1.25rem 1.1rem;
        color: inherit;
        text-decoration: none;
      }
      .card h2 {
        display: flex;
        align-items: baseline;
        gap: 0.5rem;
        margin: 0;
        font-size: 1.15rem;
      }
      .version {
        font-size: 0.8rem;
        font-weight: 400;
        color: var(--muted);
      }
      .card p {
        margin: 0.6rem 0 0;
        color: var(--muted);
        font-size: 0.92rem;
        line-height: 1.5;
      }
      .pieces {
        list-style: none;
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        margin: 1rem 0 0;
        padding: 0;
      }
      .pieces li {
        border: 1px solid var(--edge);
        border-radius: 999px;
        padding: 0.15rem 0.55rem;
        font-size: 0.75rem;
        color: var(--muted);
      }
      .open {
        display: inline-block;
        margin-top: 1rem;
        font-size: 0.85rem;
        font-weight: 600;
        color: var(--accent, #017cee);
      }
      footer {
        margin-top: 3rem;
        color: var(--muted);
        font-size: 0.85rem;
      }
      footer a {
        color: inherit;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Apache projects, in your browser</h1>
      <p class="lede">
        Each project below runs entirely in this tab &mdash; compiled to WebAssembly, with no server,
        no container and no signup. Pick one and it boots in front of you.
      </p>
      <ul id="projects"></ul>
      <footer>
        Source: <a href="https://github.com/iancmoritz/apacheprojects">iancmoritz/apacheprojects</a>
      </footer>
    </main>
    <script type="module" src="/src/home.ts"></script>
  </body>
</html>
