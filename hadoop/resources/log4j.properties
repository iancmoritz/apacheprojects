# Hadoop's own logging, sent to stdout, which CheerpJ puts in the page (and the devtools console).
# Without this the release's jars have no appender at all and the NameNode, DataNode and job runner
# start up silently -- which is exactly what you need to read when something in the tab goes wrong.
log4j.rootLogger=INFO, page
log4j.appender.page=org.apache.log4j.ConsoleAppender
log4j.appender.page.target=System.out
log4j.appender.page.layout=org.apache.log4j.PatternLayout
log4j.appender.page.layout.ConversionPattern=%-5p %c{1}: %m%n

# Things that are noise here rather than information: the retry loops the page reports itself, the
# metrics system's per-source registration, and the block scanner's periodic chatter.
log4j.logger.org.apache.hadoop.metrics2=WARN
log4j.logger.org.apache.hadoop.util.NativeCodeLoader=ERROR
log4j.logger.org.apache.hadoop.hdfs.server.datanode.VolumeScanner=WARN
log4j.logger.org.apache.hadoop.hdfs.server.blockmanagement.BlockPlacementPolicy=WARN
log4j.logger.org.apache.hadoop.security.authentication=WARN
log4j.logger.org.eclipse.jetty=WARN
