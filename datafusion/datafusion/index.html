<html lang="en" data-project="datafusion">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DataFusion in the browser</title>
    <link rel="stylesheet" href="../src/datafusion.css" />
  </head>
  <body class="app">
    <header class="topbar">
      <a class="topbar__back" href="/">&larr; Projects</a>
      <h1>DataFusion</h1>
      <span class="topbar__status" id="status">starting&hellip;</span>
      <span class="topbar__grow"></span>
      <span class="topbar__facts" id="engine"></span>
    </header>
    <main class="app__main">
      <aside class="catalogue">
        <h2>Tables</h2>
        <div id="tables" class="note">waiting for the engine&hellip;</div>
        <div id="drop">
          <div>Drop a CSV or Parquet file here</div>
          <label>
            or choose one
            <input id="file" type="file" accept=".csv,.parquet,.pq" multiple />
          </label>
          <div class="note">It is registered as a table in this tab. Nothing is uploaded.</div>
        </div>
        <h2>Example queries</h2>
        <div id="examples"></div>
      </aside>
      <section class="workbench">
        <div class="app__boot" id="boot"></div>
        <textarea id="editor" spellcheck="false" aria-label="SQL"></textarea>
        <div class="toolbar">
          <button id="run" class="button button--primary" type="button">Run</button>
          <button id="explain" class="button" type="button">EXPLAIN</button>
          <button id="analyze" class="button" type="button">EXPLAIN ANALYZE</button>
          <span class="note">&#8984;/Ctrl + Enter</span>
          <span class="toolbar__grow"></span>
          <span class="note mono" id="timing"></span>
        </div>
        <div class="tabs" id="tabs">
          <button type="button" data-pane="results" aria-selected="true">Results</button>
          <button type="button" data-pane="physical" aria-selected="false">Physical plan</button>
          <button type="button" data-pane="logical" aria-selected="false">Logical plan</button>
        </div>
        <div id="panes">
          <div id="pane-results"></div>
          <div id="pane-physical" hidden></div>
          <div id="pane-logical" hidden></div>
        </div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
