[workspace]
members = ["crates/workbench", "crates/mkdata"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
arrow = { version = "58.3", default-features = false, features = ["csv", "ipc"] }
parquet = { version = "58.3", default-features = false, features = ["arrow", "snap"] }

# The wasm module is the whole payload of the page, so optimise it for size rather than speed and
# keep no debug info in it; `wasm-opt -Oz` in scripts/build-wasm.mjs takes another pass afterwards.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "debuginfo"
