<html lang="en" data-project="spark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spark in the browser</title>
    <link rel="stylesheet" href="../src/spark.css" />
  </head>
  <body class="app">
    <header class="topbar">
      <a class="topbar__back" href="/">&larr; Projects</a>
      <h1>Spark</h1>
      <span class="topbar__status" id="status">starting&hellip;</span>
      <span class="topbar__grow"></span>
      <span class="topbar__facts" id="facts"></span>
    </header>
    <main class="app__main">
      <div class="app__boot" id="boot"></div>
      <section id="query" hidden>
        <div class="row">
          <label for="samples">Sample queries</label>
          <select id="samples"></select>
          <span class="note" id="schema"></span>
        </div>
        <textarea id="sql" spellcheck="false" aria-label="Spark SQL"></textarea>
        <div class="row">
          <button id="run" class="button button--primary" type="button">Run</button>
          <span class="note" id="result-note"></span>
        </div>
        <div class="tabs" role="tablist">
          <button id="tab-rows" type="button" role="tab" aria-selected="true">Results</button>
          <button id="tab-plan" type="button" role="tab" aria-selected="false">Physical plan</button>
          <button id="tab-stages" type="button" role="tab" aria-selected="false">
            Stages &amp; tasks
          </button>
        </div>
        <div class="results" id="panel-rows"></div>
        <div class="results" id="panel-plan" hidden><pre id="plan"></pre></div>
        <div class="results" id="panel-stages" hidden></div>
      </section>
    </main>
    <script src="https://cjrtnc.leaningtech.com/4.2/loader.js"></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
